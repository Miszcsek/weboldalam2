<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #d82323; --bg-dark: #121212; }
        body { font-family: 'Josefin Sans', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }
        nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-red); }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 2rem 5%; }
        .gallery-item { background: #333; height: 250px; border-radius: 8px; overflow: hidden; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(50%); transition: 0.5s; }
        .gallery-item img:hover { filter: grayscale(0%); transform: scale(1.1); }
        h1 { text-align: center; margin-top: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>
    <h1>Galéria</h1>
    <div class="gallery-grid">
        <div class="gallery-item"><img src="https://via.placeholder.com/400x300/d82323/000000?text=Klub+1" alt="Klub"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x300/d82323/000000?text=Klub+2" alt="Klub"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x300/d82323/000000?text=Klub+3" alt="Klub"></div>
        <div class="gallery-item"><img src="https://via.placeholder.com/400x300/d82323/000000?text=Klub+4" alt="Klub"></div>
    </div>
</body>
</html>

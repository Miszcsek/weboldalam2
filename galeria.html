<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #d82323; --bg-dark: #121212; }
        body { font-family: 'Josefin Sans', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }
        
        /* Navigáció */
        nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-red); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; }

        .container { padding: 2rem 5%; }
        h1 { text-align: center; margin-bottom: 2rem; color: var(--main-red); }

        /* Galéria rács */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .gallery-item { 
            background: #1e1e1e; 
            height: 300px; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #333;
            cursor: pointer;
        }
        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 0.4s ease;
        }
        .gallery-item:hover img { 
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* LIGHTBOX (MODAL) STÍLUS */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border: 3px solid var(--main-red);
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(216, 35, 35, 0.3);
        }
        .close-lightbox {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Galéria</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/276r7e.jpg?ph=81de119f28" alt="Klub belső 1">
            </div>
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/450/276r7e.jpg?ph=81de119f28" alt="Részlet fotó">
            </div>
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/276r7e.jpg?ph=81de119f28" alt="Hangulat kép">
            </div>
        </div>
    </div>

    <div id="lightboxModal" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" src="">
    </div>

    <script>
        const lightbox = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.querySelector('.close-lightbox');

        // Minden képre rátesszük a kattintás figyelőt
        document.querySelectorAll('.gallery-item img').forEach(image => {
            image.onclick = () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = image.src;
            };
        });

        // Bezárás gombra kattintva
        closeBtn.onclick = () => {
            lightbox.style.display = 'none';
        };

        // Kép mellé kattintva is bezáródik
        lightbox.onclick = (e) => {
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
            }
        };
    </script>

</body>
</html>

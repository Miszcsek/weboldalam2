<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #d82323; --bg-dark: #121212; }
        body { font-family: 'Josefin Sans', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }
        nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-red); }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; }

        .container { padding: 2rem 5%; }
        h1 { text-align: center; margin-bottom: 2rem; color: var(--main-red); }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }
        .gallery-item { 
            background: #1e1e1e; 
            height: 300px; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #333;
        }
        .gallery-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 0.5s ease;
        }
        .gallery-item:hover img { 
            transform: scale(1.05);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Galéria</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/276r7e.jpg?ph=81de119f28" alt="Klub belső">
            </div>
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/450/276r7e.jpg?ph=81de119f28" alt="Részlet">
            </div>
            <div class="gallery-item">
                <img src="https://duyn491kcolsw.cloudfront.net/files/27/276/276r7e.jpg?ph=81de119f28" alt="Hangulat">
            </div>
        </div>
    </div>
</body>
</html>

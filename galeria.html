<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://duyn491kcolsw.cloudfront.net/files/27/276/450/276r7e.jpg?ph=81de119f28">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main-red: #d82323; 
            --bg-dark: #0a0a0a; 
            --card-bg: #161616; 
        }

        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* --- JAVÍTOTT NAVIGÁCIÓ --- */
nav { 
            background: rgba(0,0,0,0.95); 
            padding: 0.8rem 3%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--main-red); 
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.5rem; text-decoration: none; color: white; font-weight: 600; letter-spacing: 1px; flex-shrink: 0; }
        .logo span { color: var(--main-red); }
        
        .nav-links { 
            list-style: none; 
            display: flex; 
            gap: 15px; 
            margin: 0; 
            padding: 0; 
        }
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            transition: 0.3s;
            white-space: nowrap; /* Megakadályozza a szavak törését */
        }
        .nav-links a:hover { color: var(--main-red); }

        /* --- MOBIL JAVÍTÁSOK (Amikor már nem férne el) --- */
        @media (max-width: 768px) {
            nav { 
                flex-direction: column; /* Egymás alá teszi a logót és a menüt */
                padding: 10px 5px;
            }
            .logo { 
                margin-bottom: 10px; 
                font-size: 1.4rem; 
            }
            .nav-links { 
                display: flex;
                flex-wrap: wrap; /* Ha sok a menüpont, több sorba tördeli */
                justify-content: center;
                gap: 8px 12px; /* Függőleges és vízszintes távolság */
                width: 100%;
            }
            .nav-links a { 
                font-size: 0.7rem; /* Kicsit kisebb betű, hogy több férjen el */
                padding: 5px;
            }
        }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; letter-spacing: 2px; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--main-red); }

        /* --- JAVÍTOTT GALÉRIA STÍLUS --- */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 15px; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 0.5rem; color: white; }
        .subtitle { text-align: center; color: var(--main-red); margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 250px;
            gap: 15px;
            grid-auto-flow: dense;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #222;
        }

        .gallery-item.wide { grid-column: span 2; }
        .gallery-item.tall { grid-row: span 2; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img { transform: scale(1.05); }

        /* --- MOBILRE OPTIMALIZÁLÁS --- */
        @media (max-width: 768px) {
            nav { justify-content: center; padding: 10px; }
            .logo { width: 100%; text-align: center; margin-bottom: 10px; font-size: 1.5rem; }
            .nav-links { gap: 10px; justify-content: center; width: 100%; }
            .nav-links a { font-size: 0.75rem; }

            .gallery-grid {
                grid-template-columns: 1fr; /* Mobilon egy oszlop */
                grid-auto-rows: 200px;
            }
            .gallery-item.wide, .gallery-item.tall {
                grid-column: span 1;
                grid-row: span 1;
            }
            h1 { font-size: 2rem; }
        }

        /* --- LIGHTBOX --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid var(--main-red);
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            color: white; font-size: 40px; cursor: pointer;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">Delight<span>Club</span></a>
    <ul class="nav-links">
        <li><a href="index.html">Rólunk</a></li>
        <li><a href="programok.html">Programok</a></li> <li><a href="szabalyok.html">Szabályok</a></li>
        <li><a href="galeria.html">Galéria</a></li>
        <li><a href="gyik.html">GYIK</a></li>
        <li><a href="kapcsolat.html">Kapcsolat</a></li>
    </ul>
</nav>

    <div class="container">

        <div class="gallery-grid">
            <div class="gallery-item tall">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000021-65f0265f04/IMG_20211226_224839-5.webp?ph=81de119f28" alt="DelightClub 0">
            </div>
            <div class="gallery-item wide">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000020-42eeb42eec/IMG-7b3b1d11a6ad50dbe99ba7c4cac77f6a-V-4.webp?ph=81de119f28" alt="DelightClub 2">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000017-1838518387/received_171949960972000-8.webp?ph=81de119f28" alt="DelightClub 3">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000018-1e7021e704/received_248984616484241-3.webp?ph=81de119f28" alt="DelightClub 4">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000019-34b9e34b9f/received_369450091062438-1.webp?ph=81de119f28" alt="DelightClub 5">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000025-3fb633fb65/received_983782885448358-9.webp?ph=81de119f28" alt="DelightClub 6">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000023-cb01bcb01d/received_399690661049121.webp?ph=81de119f28" alt="DelightClub 7">

            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000033-ad661ad66a/1000001883%281%29.webp?ph=81de119f28" alt="DelightClub 9">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000035-65ecb65ece/1000038367%281%29.webp?ph=81de119f28" alt="DelightClub 10">
            </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Nagyított kép">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.querySelectorAll('.gallery-item img').forEach(image => {
            image.onclick = () => {
                lightbox.classList.add('active');
                lightboxImg.src = image.src;
                document.body.style.overflow = 'hidden';
            };
        });

        lightbox.onclick = (e) => {
            if (e.target !== lightboxImg) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        };
    </script>

</body>

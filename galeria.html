<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main-red: #d82323; 
            --bg-dark: #0a0a0a; 
            --card-bg: #161616; 
        }

        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* --- NAVIGÁCIÓ (Egységesített) --- */
        nav { 
            background: rgba(0,0,0,0.95); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--main-red); 
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; letter-spacing: 2px; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--main-red); }

        /* --- GALÉRIA STÍLUS --- */
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 20px; }
        h1 { text-align: center; font-size: 3rem; margin-bottom: 1rem; color: white; }
        .subtitle { text-align: center; color: var(--main-red); margin-bottom: 3rem; text-transform: uppercase; letter-spacing: 2px; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #222;
        }

        /* Néhány kép legyen nagyobb a modernebb hatásért */
        .gallery-item.wide { grid-column: span 2; }
        .gallery-item.tall { grid-row: span 2; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        /* --- LIGHTBOX (Képnézegető) --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border: 3px solid var(--main-red);
            box-shadow: 0 0 30px rgba(216, 35, 35, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .lightbox.active img { transform: scale(1); }

        /* Bezáró gomb */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .gallery-item.wide { grid-column: span 1; }
            .nav-links { display: none; } /* Mobilmenüt később finomíthatjuk */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="gyik.html">GYIK</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Pillanatképek</h1>
        <p class="subtitle">Exkluzív környezet, felejthetetlen hangulat</p>

        <div class="gallery-grid">
            <div class="gallery-item tall">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000021-65f0265f04/IMG_20211226_224839-5.webp?ph=81de119f28" alt="DelightClub belső">
            </div>
            <div class="gallery-item wide">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000020-42eeb42eec/IMG-7b3b1d11a6ad50dbe99ba7c4cac77f6a-V-4.webp?ph=81de119f28" alt="DelightClub hangulat">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000017-1838518387/received_171949960972000-8.webp?ph=81de119f28" alt="Bár részlet">
             </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000018-1e7021e704/received_248984616484241-3.webp?ph=81de119f28" alt="Bár részlet">
            </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000019-34b9e34b9f/received_369450091062438-1.webp?ph=81de119f28" alt="Bár részlet">
             </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000025-3fb633fb65/received_983782885448358-9.webp?ph=81de119f28" alt="Bár részlet">
             </div>
            <div class="gallery-item">
                <img src="https://81de119f28.cbaul-cdnwnd.com/9e169b91ea1c0f30efa598fb7a454c7d/200000023-cb01bcb01d/received_399690661049121.webp?ph=81de119f28" alt="Bár részlet">
            </div>
             </div>
    </div>

    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Nagyított kép">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.close-btn');

        // Minden galéria elemre kattintás figyelése
        document.querySelectorAll('.gallery-item img').forEach(image => {
            image.onclick = () => {
                lightbox.classList.add('active');
                lightboxImg.src = image.src;
                document.body.style.overflow = 'hidden'; // Ne görögjön a háttér
            };
        });

        // Bezárás kattintásra
        lightbox.onclick = (e) => {
            if (e.target !== lightboxImg) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        };
    </script>

</body>
</html>

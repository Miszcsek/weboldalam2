<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galéria - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #d82323; --bg-dark: #121212; }
        body { font-family: 'Josefin Sans', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; }
        nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-red); }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; }
        .container { padding: 2rem 5%; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .gallery-item { height: 300px; border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #333; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .gallery-item:hover img { transform: scale(1.05); }
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .lightbox img { max-width: 90%; max-height: 80%; border: 2px solid var(--main-red); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="gyik.html">GYIK</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 style="text-align: center; color: var(--main-red);">Galéria</h1>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="https://duyn491kcolsw.cloudfront.net/files/27/276/276r7e.jpg?ph=81de119f28"></div>
            <div class="gallery-item"><img src="https://duyn491kcolsw.cloudfront.net/files/27/276/450/276r7e.jpg?ph=81de119f28"></div>
        </div>
    </div>
    <div id="lb" class="lightbox" onclick="this.style.display='none'"><img id="lb-img"></div>
    <script>
        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.onclick = (e) => {
                e.stopPropagation();
                document.getElementById('lb').style.display='flex';
                document.getElementById('lb-img').src = img.src;
            }
        });
    </script>
</body>
</html>

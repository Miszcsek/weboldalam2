<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelightClub - Galéria</title>
    <style>
        /* Alapstílusok */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Sötét háttér a klub hangulathoz */
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #d82323; /* A kódodban szereplő piros árnyalat */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* Galéria Rács */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Kép kártya stílusa */
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            background-color: #222;
            aspect-ratio: 3 / 4; /* Egységesített méretarány */
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(216, 35, 35, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Kitölti a területet torzítás nélkül */
            display: block;
            cursor: pointer;
        }

        /* Mobil nézet finomítása */
        @media (max-width: 600px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                grid-gap: 10px;
            }
        }
    </style>
</head>
<body>

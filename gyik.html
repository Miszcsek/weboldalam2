<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="https://duyn491kcolsw.cloudfront.net/files/27/276/450/276r7e.jpg?ph=81de119f28"> 
    <title>GYIK - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main-red: #d82323; 
            --bg-dark: #0a0a0a; 
            --card-bg: #161616; 
        }

        body { 
            font-family: 'Josefin Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: #e0e0e0; 
            margin: 0; 
            overflow-x: hidden;
        }
        
        /* --- JAVÍTOTT NAVIGÁCIÓ (MOBILBARÁT) --- */
        nav { 
            background: rgba(0,0,0,0.95); 
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--main-red); 
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
        }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; letter-spacing: 2px; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--main-red); }

        /* --- TARTALOM --- */
        .container { max-width: 800px; margin: 3rem auto; padding: 0 20px; }
        h1 { color: white; text-align: center; font-size: 2.5rem; margin-bottom: 2rem; }

        .faq-item { 
            background: var(--card-bg); 
            margin-bottom: 15px; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #222; 
            transition: 0.3s;
        }
        .faq-q { 
            padding: 20px; 
            font-weight: 600; 
            color: white; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            user-select: none;
        }
        .faq-q:hover { background: #1f1f1f; }
        .faq-q::after { 
            content: '+'; 
            color: var(--main-red); 
            font-size: 1.5rem; 
            transition: 0.3s;
        }
        .faq-item.active { border-color: var(--main-red); }
        .faq-item.active .faq-q::after { transform: rotate(45deg); content: '+'; }
        
        .faq-a { 
            padding: 0 20px; 
            max-height: 0; 
            overflow: hidden; 
            transition: 0.3s ease-out; 
            color: #bbb; 
            background: rgba(0,0,0,0.2); 
            line-height: 1.6;
        }
        .faq-item.active .faq-a { 
            padding: 20px; 
            max-height: 500px; 
            border-top: 1px solid #222; 
        }

        /* --- MOBIL JAVÍTÁSOK --- */
        @media (max-width: 768px) {
            nav { justify-content: center; padding: 10px; }
            .logo { width: 100%; text-align: center; margin-bottom: 10px; font-size: 1.5rem; }
            .nav-links { gap: 10px; justify-content: center; width: 100%; }
            .nav-links a { font-size: 0.75rem; }
            
            h1 { font-size: 1.8rem; }
            .container { margin: 2rem auto; }
            .faq-q { padding: 15px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="gyik.html">GYIK</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Gyakran Ismételt Kérdések</h1>
        
        <div class="faq-list" id="faq-list">
            </div>
    </div>

    <script>
        const faqs = [
            {q: "1. Hol található a klub?", a: "Budapest 9. kerületében, a Klinikák közelében. A pontos címet csak a konkrét résztvevőknek adjuk meg."},
            {q: "2. Mikor vannak bulik?", a: "Általában havonta egyszer, maximum kétszer tartunk bulit, legtöbbször péntek este 20.00-tól, cca. 3.00-ig. A bulik vége nincs kőbe vésve, volt már hogy reggel 7.00-ig tartott."},
            {q: "3. Vannak öltözők?", a: "Igen, zárható szekrényekkel, és széffel is rendelkezünk. Minden ruha, illetve érték biztonságosan tárolható."},
            {q: "4. Hogy néz ki a helyszín?", a: "2 helyiségből, egy nagyobb társalgó részből, és egy kisebb játszótérből áll a helyszín. Ezenkívül van egy öltöző, és egy zuhanyzó, WC-vel. Zárható szobák nincsenek nálunk."},
            {q: "5. Kik szoktak a vendégek lenni?", a: "Jellemzően a 30-as 40-es korosztály. Idősebbeket csak abban az esetben várunk, ha fiatalos, csinos, koruknál fiatalabbnak kinéző emberekről van szó."},
            {q: "6. Milyen a nemek aránya egy buliban?", a: "Nagy általánosságban 15-18 pár, 2-3 szóló lány, 6-8 szóló pasi szokott lenni."},
            {q: "7. Kötelező szexelni a buliban?", a: "Semmi se kötelező, mindenki azt és azzal csinál csak, amit, és akivel szeretne. Ha csak nézelődni szeretnél, az is teljesen elfogadott viselkedés."},
            {q: "8. Kezdőként is lehet jönni a buliba?", a: "Természetesen. Senkitől sem kérünk referenciát. :)"},
            {q: "9. Hogy lehet jelentkezni a bulikba?", a: "Mindenkitől kérünk egy rövid bemutatkozást és egy arcot is láttató fotót (nem szexuálisat). Szeretnénk, ha meglenne az alapszimpátia."},
            {q: "10. Félünk, hogy kikerülnek rólunk adatok", a: "Senkitől sem kérünk visszaélésre alkalmas adatot. Fotó, videó, hangfelvétel nem készül semmilyen eseményről."}
        ];

        const list = document.getElementById('faq-list');
        faqs.forEach(item => {
            const div = document.createElement('div');
            div.className = 'faq-item';
            div.innerHTML = `<div class="faq-q">${item.q}</div><div class="faq-a">${item.a}</div>`;
            div.onclick = () => {
                // Csak az aktuálisat nyitja ki, a többit bezárja (opcionális, de elegáns)
                const activeItems = document.querySelectorAll('.faq-item.active');
                activeItems.forEach(el => { if(el !== div) el.classList.remove('active'); });
                
                div.classList.toggle('active');
            };
            list.appendChild(div);
        });
    </script>
</body>
</html>

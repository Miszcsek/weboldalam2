<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYIK - DelightClub</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #d82323; --bg-dark: #121212; }
        body { font-family: 'Josefin Sans', sans-serif; background-color: var(--bg-dark); color: #e0e0e0; margin: 0; }
        nav { background: rgba(0,0,0,0.9); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--main-red); }
        .logo { font-size: 1.8rem; text-decoration: none; color: white; font-weight: 600; }
        .logo span { color: var(--main-red); }
        .nav-links { list-style: none; display: flex; gap: 20px; padding: 0; }
        .nav-links a { color: white; text-decoration: none; text-transform: uppercase; font-size: 0.9rem; }
        .container { max-width: 800px; margin: 4rem auto; padding: 0 20px; }
        .faq-item { background: #1e1e1e; margin-bottom: 10px; border-radius: 5px; cursor: pointer; }
        .faq-q { padding: 20px; font-weight: 600; color: white; border-bottom: 1px solid #333; }
        .faq-a { padding: 20px; display: none; color: #bbb; background: #1a1a1a; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Delight<span>Club</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Rólunk</a></li>
            <li><a href="szabalyok.html">Szabályok</a></li>
            <li><a href="galeria.html">Galéria</a></li>
            <li><a href="gyik.html">GYIK</a></li>
            <li><a href="kapcsolat.html">Kapcsolat</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 style="color: var(--main-red); text-align: center;">Gyakori Kérdések</h1>
        <div class="faq-item" onclick="toggle(this)">
            <div class="faq-q">Hol található a klub?</div>
            <div class="faq-a" style="display:block">Budapest 9. kerületében, a Klinikák közelében. A pontos címet csak résztvevőknek adjuk meg.</div>
        </div>
        <div class="faq-item" onclick="toggle(this)">
            <div class="faq-q">Kötelező szexelni a buliban?</div>
            <div class="faq-a">Semmi sem kötelező! A nézelődés is teljesen elfogadott.</div>
        </div>
    </div>
    <script>
        function toggle(el) {
            const a = el.querySelector('.faq-a');
            a.style.display = a.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
